services:
  api:
    build:
      context: ./services/api
    environment:
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      DEMO_MODE: ${DEMO_MODE:-true}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
  forecasting:
    build:
      context: ./services/forecasting
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 15s
      timeout: 3s
      retries: 5
  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
  connectors:
    build:
      context: ./services/connectors
    environment:
      # Hosted path: PostgREST with the service-role key (no database password).
      SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      # Optional direct Postgres fallback. Set locally before `docker compose up`; never commit.
      SUPABASE_DB_URL: ${SUPABASE_DB_URL:-}
      INGEST_ORGANIZATION_ID: ${INGEST_ORGANIZATION_ID:-00000000-0000-0000-0000-000000000001}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Which sources the loop runs. Static archives are better run on demand:
      # `docker compose run --rm connectors python -m app.worker all`
      CONNECTOR_SOURCES: ${CONNECTOR_SOURCES:-maritime}
      CONNECTOR_POLL_SECONDS: ${CONNECTOR_POLL_SECONDS:-3600}
      FAOSTAT_DATASET: ${FAOSTAT_DATASET:-FBS}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
